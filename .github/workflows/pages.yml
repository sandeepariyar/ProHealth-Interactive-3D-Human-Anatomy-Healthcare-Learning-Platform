name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/validate-project.mjs
      - run: npm run assets:verify
      - run: npm test
      - run: npm run build
      - name: Verify published anatomy models
        run: |
          test -s dist/index.html
          for model in skeletal muscular visceral cardiovascular joints nervous lymphatic; do
            test -s "dist/models/z-anatomy/$model.glb"
          done
          test -s dist/draco/draco_decoder.wasm
          du -sh dist
      # Build/asset verification deliberately precedes Pages configuration, so
      # CI can validate the application even before Pages is enabled manually.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment

